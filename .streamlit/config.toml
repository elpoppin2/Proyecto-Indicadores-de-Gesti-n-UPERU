# Tema visual del dashboard: fondo blanco, menú lateral negro, acento rojo.
# Definido por el usuario. El rojo (#ff0000) es el rojo exacto del logo de UNACEM, el
# mismo de los gráficos (dashboard/theme.py) y de la web de Django.

[server]
runOnSave = true

[theme]
base = "light"
primaryColor = "#ff0000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f4f2"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#ff0000"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#ffffff"
primaryColor = "#ff0000"
borderColor = "#2c2c2c"
